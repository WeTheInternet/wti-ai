name: wti-ai-msg

on:
  pull_request:
    paths:
      - 'plugins/wti-ai-msg/**'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/wti-ai-msg.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/wti-ai-msg/**'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/wti-ai-msg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    defaults:
      run:
        working-directory: plugins/wti-ai-msg
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Mechanics and portable packaging evals
        run: python3 -m unittest discover -s evals -p 'test_*.py' -v
      - name: Build standalone archive
        run: |
          python3 package.py --output wti-ai-msg.zip
          sha256sum wti-ai-msg.zip > wti-ai-msg.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: wti-ai-msg-python-${{ matrix.python }}
          path: |
            plugins/wti-ai-msg/wti-ai-msg.zip
            plugins/wti-ai-msg/wti-ai-msg.zip.sha256
          if-no-files-found: error
